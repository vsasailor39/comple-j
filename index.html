<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Il Compleanno di Jessy!</title>
  <style>
    @font-face {
      font-family: 'CairoPixel';
      src: url('cairopixel.ttf') format('truetype');
    }

    * {
      box-sizing: border-box;
      user-select: none;
      font-family: 'CairoPixel', sans-serif;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #8a9a86;
    }

    .screen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background-color: #8a9a86;
      transition: opacity 0.5s ease;
    }

    .hidden { display: none !important; }

    /* PARTE 1: INTRO (ELEMENTI MOLTO PIÙ GRANDI) */
    #btn-start {
      background: none; border: none; cursor: pointer;
    }
    #btn-start img { 
      width: 500px; 
      max-width: 95vw;
      transition: transform 0.2s; 
    }
    #btn-start img:active { transform: scale(0.95); }

    .intro-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      width: 100%;
      height: 100%;
      padding: 10px;
    }

    /* Torta e Personaggi GIGANTI */
    #stage-torta img {
      max-height: 75vh !important;
      width: auto;
      object-fit: contain;
    }

    .pergamena {
      background: #fff3a0;
      border: 6px solid #8d5b12;
      border-radius: 18px;
      padding: 25px;
      max-width: 85%;
      max-height: 70vh;
      overflow-y: auto;
      color: #3d2200;
      text-align: left;
      font-size: 1.5rem;
      line-height: 1.6;
      box-shadow: 0 10px 0 #4a2f08;
    }

    #red-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 0, 0, 0.5);
      z-index: 99;
      pointer-events: none;
    }

    .error-text {
      position: absolute;
      z-index: 100;
      color: #fff;
      font-size: 2.8rem;
      font-weight: bold;
      text-shadow: 4px 4px #000;
      animation: blink 0.4s infinite alternate;
      padding: 20px;
      max-width: 90vw;
    }

    @keyframes blink {
      0% { opacity: 1; }
      100% { opacity: 0.1; }
    }

    /* EFFETTO BUCO NERO / VORTICE */
    .vortice {
      animation: spinScale 1.8s forwards cubic-bezier(0.6, -0.28, 0.735, 0.045);
      transform-origin: center center;
    }

    @keyframes spinScale {
      0% { transform: rotate(0deg) scale(1); opacity: 1; }
      100% { transform: rotate(1440deg) scale(0); opacity: 0; }
    }

    /* PARTE 2: GIOCO & SCENA INTERMEDIA */
    #game-screen {
      position: relative;
      overflow: hidden;
      background-color: #8a9a86;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .progress-container {
      position: absolute;
      top: 25px;
      width: 80%;
      max-width: 600px;
      height: 35px;
      background: rgba(0,0,0,0.6);
      border: 4px solid #fff;
      border-radius: 20px;
      overflow: hidden;
      z-index: 10;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width 0.2s ease-out;
    }

    /* Cutscene con Vignette PNG e Personaggio */
    #cutscene-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #8a9a86;
      z-index: 30;
    }

    .vignetta-img {
      max-width: 80vw;
      max-height: 35vh;
      object-fit: contain;
      filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.4));
    }

    .personaggio-cutscene {
      max-height: 45vh;
      width: auto;
      object-fit: contain;
      margin-top: 15px;
    }

    /* PARTE 3: REGALI (MOLTO PIÙ GRANDI) */
    #gifts-screen {
      background: url('sfondo-regali.png') center/cover no-repeat;
    }

    .icons-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      margin-top: 30px;
      max-width: 95vw;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      font-size: 1.5rem;
      text-shadow: 3px 3px #000;
    }

    /* Icone Regali GIGANTI */
    .icon-btn img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      transition: transform 0.2s ease;
      filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.6));
    }

    .icon-btn img:hover { transform: scale(1.15); }

    .back-btn {
      position: absolute;
      bottom: 25px;
      left: 25px;
      background: #ff4081;
      color: white;
      padding: 16px 32px;
      border-radius: 14px;
      border: 4px solid #fff;
      cursor: pointer;
      font-size: 1.5rem;
      box-shadow: 0 6px 0 #9c0042;
    }

    /* Foto Ingrandite */
    .gallery-grid {
      display: flex;
      gap: 25px;
      overflow-x: auto;
      max-width: 95vw;
      padding: 20px;
    }

    .gallery-grid img {
      height: 400px; /* Foto decisamente più grandi */
      border-radius: 14px;
      border: 5px solid #fff;
      box-shadow: 0 8px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- PARTE 1: INTRODUZIONE -->
  <div id="part1" class="screen">
    <button id="btn-start" onclick="iniziaEsperienza()">
      <img src="bottone-inizio.png" alt="Clicca Qui">
    </button>

    <div id="stage-torta" class="intro-container hidden">
      <img src="personaggio-spensierato.gif" alt="Personaggio">
      <img src="torta.gif" alt="Torta">
    </div>

    <div id="stage-pergamena" class="intro-container hidden">
      <div class="pergamena">
        <div id="pergamena-testo"></div>
        <br>
        <span id="btn-continua" style="color: #d32f2f; cursor: pointer; font-weight: bold; font-size: 1.4rem;" onclick="clickContinua()">
          ▶ Schiaccia qui per continuare
        </span>
      </div>
      <img id="pers-pergamena" src="personaggio-sorpreso.gif" style="max-height: 60vh;">
      <img id="vignetta-dubbio" class="hidden" src="vignetta-dubbio.png" style="height: 150px; position: absolute; right: 5%; top: 5%;">
    </div>

    <div id="red-overlay" class="hidden"></div>
    <div id="error-msg" class="error-text hidden">ERRORE.EXE!<br>Per poter proseguire, recupera i regali!</div>
  </div>

  <!-- PARTE 2: VIDEOGIOCO & TRANSIIZONE -->
  <div id="game-screen" class="screen hidden">
    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    
    <!-- Cutscene con Vignette PNG e Personaggio -->
    <div id="cutscene-container" class="hidden">
      <img id="cutscene-vignetta" class="vignetta-img" src="vignetta-ohno.png">
      <img id="cutscene-pers" class="personaggio-cutscene" src="personaggio-spensierato.gif">
    </div>

    <canvas id="game-canvas"></canvas>
  </div>

  <!-- PARTE 3: REGALI -->
  <div id="gifts-screen" class="screen hidden">
    <div id="menu-icons">
      <h2 style="color: white; text-shadow: 4px 4px #000; font-size: 3rem; margin-bottom: 15px;">I Tuoi Regali</h2>
      <div class="icons-grid">
        <button class="icon-btn" onclick="apriRegalo('fiori')"><img src="icona-fiori.png"><span>Fiori</span></button>
        <button class="icon-btn" onclick="apriRegalo('foto')"><img src="icona-foto.png"><span>Foto</span></button>
        <button class="icon-btn" onclick="apriRegalo('lettera')"><img src="icona-lettera.png"><span>Lettera</span></button>
        <button class="icon-btn" onclick="apriRegalo('video')"><img src="icona-video.png"><span>Video</span></button>
        <button class="icon-btn" onclick="apriRegalo('gatto')"><img src="icona-gatto.png"><span>Extra</span></button>
      </div>
    </div>

    <!-- Dettaglio Regalo -->
    <div id="regalo-dettaglio" class="screen hidden" style="background: rgba(0,0,0,0.92); z-index: 100;">
      <div id="contenuto-regalo"></div>
      <button class="back-btn" onclick="chiudiRegalo()">Torna indietro</button>
    </div>
  </div>

  <script>
    function playAudio(src, loop = false) {
      const a = new Audio(src);
      a.loop = loop;
      a.play().catch(e => console.log("Audio non riprodotto:", e));
      return a;
    }

    let clickCount = 0;
    let bgMusic = null;

    // --- PARTE 1 LOGICA ---
    function iniziaEsperienza() {
      playAudio('click.mp3');
      document.getElementById('btn-start').classList.add('hidden');
      document.getElementById('stage-torta').classList.remove('hidden');
      
      let auguriAudio = playAudio('tanti-auguri.mp3');
      auguriAudio.onended = () => {
        playAudio('sparizione-torta.mp3');
        document.getElementById('stage-torta').classList.add('hidden');
        mostraPergamena();
      };
    }

    function mostraPergamena() {
      document.getElementById('stage-pergamena').classList.remove('hidden');
      const testo = "Cara Jessy,\nQuesto è un piccolo regalo virtuale da parte mia!\nSpero che ti piaccia, e che passerai un compleanno dei 18 felice insieme a chi vuoi bene!\nPurtroppo nella data esatta non riesco ad essere presente, indi per cui ho deciso di mandarti un bacio e un abbraccio attraverso questo link!\nDi seguito troverai dei piccoli regali! Spero ti piacciano!";
      
      let i = 0;
      const target = document.getElementById('pergamena-testo');
      function typeWriter() {
        if (i < testo.length) {
          target.innerHTML += testo.charAt(i) === '\n' ? '<br>' : testo.charAt(i);
          i++;
          setTimeout(typeWriter, 35);
        }
      }
      typeWriter();
    }

    function clickContinua() {
      playAudio('click.mp3');
      clickCount++;
      
      if (clickCount === 1) {
        document.getElementById('vignetta-dubbio').classList.remove('hidden');
      } else if (clickCount >= 3) {
        document.getElementById('red-overlay').classList.remove('hidden');
        document.getElementById('error-msg').classList.remove('hidden');
        document.getElementById('pers-pergamena').src = 'personaggio-allarme.gif';
        playAudio('allarme.mp3');

        // Effetto Buco Nero / Vortice
        setTimeout(() => {
          document.getElementById('part1').classList.add('vortice');
          setTimeout(() => {
            document.getElementById('part1').classList.add('hidden');
            avviaParte2();
          }, 1800);
        }, 3500);
      }
    }

    // --- PARTE 2: CUTSCENE CON VIGNETTE PNG E AVVIO GIOCO ---
    function avviaParte2() {
      document.getElementById('game-screen').classList.remove('hidden');
      
      const cutContainer = document.getElementById('cutscene-container');
      const cutVignetta = document.getElementById('cutscene-vignetta');
      const cutPers = document.getElementById('cutscene-pers');
      
      cutContainer.classList.remove('hidden');
      
      // 1. Prima vignetta: vignetta-ohno.png col personaggino
      cutVignetta.src = 'vignetta-ohno.png';
      cutPers.src = 'personaggio-spensierato.gif';
      playAudio('suono-sconcerto.mp3');
      
      setTimeout(() => {
        // 2. Seconda vignetta: vignetta-aiuto.png
        cutVignetta.src = 'vignetta-aiuto.png';
        
        setTimeout(() => {
          // 3. Entra in macchina e parte il gioco
          cutContainer.classList.add('hidden');
          bgMusic = playAudio('musica-gioco.mp3', true);
          startMiniGame();
        }, 3500);
      }, 3500);
    }

    function startMiniGame() {
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let score = 0;
      const targetScore = 10;
      
      // ELEMENTI GIGANTI
      const carWidth = 250;
      const carHeight = 140;
      const obsSize = 120;
      const giftSize = 100;

      let carY = canvas.height - carHeight - 30;
      let isJumping = false;
      let jumpSpeed = 0;
      const gravity = 0.8;

      const carImg = new Image(); carImg.src = 'macchina.gif';
      const obsImg = new Image(); obsImg.src = 'ostacolo.png';
      const giftImg = new Image(); giftImg.src = 'regalo-gioco.png';
      const bgImg = new Image(); bgImg.src = 'sfondo-gioco.png';

      let bgX = 0;
      let items = [];

      function spawnItem() {
        const isObstacle = Math.random() > 0.45;
        items.push({
          x: canvas.width,
          y: isObstacle ? canvas.height - obsSize - 30 : canvas.height - giftSize - 220,
          type: isObstacle ? 'obs' : 'gift'
        });
      }

      let spawnInterval = setInterval(spawnItem, 1800);

      function jump() {
        if (!isJumping) {
          isJumping = true;
          jumpSpeed = -20;
          playAudio('suono-salto.mp3');
        }
      }

      window.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(); });
      window.addEventListener('touchstart', jump);

      function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Sfondo Scalato Correttamente per Ripetere Continuamente
        if (bgImg.complete && bgImg.width > 0) {
          const bgScaledWidth = (canvas.height / bgImg.height) * bgImg.width * 0.6; // Sfondo ridotto per non sembrare troppo grande
          bgX -= 3;
          if (bgX <= -bgScaledWidth) bgX = 0;

          for (let x = bgX; x < canvas.width + bgScaledWidth; x += bgScaledWidth) {
            ctx.drawImage(bgImg, x, 0, bgScaledWidth, canvas.height);
          }
        }

        // Fisica Macchina
        if (isJumping) {
          carY += jumpSpeed;
          jumpSpeed += gravity;
          if (carY >= canvas.height - carHeight - 30) {
            carY = canvas.height - carHeight - 30;
            isJumping = false;
          }
        }

        // Disegna Macchina Gigante
        ctx.drawImage(carImg, 60, carY, carWidth, carHeight);

        // Disegna Ostacoli e Regali Giganti
        for (let i = items.length - 1; i >= 0; i--) {
          let item = items[i];
          item.x -= 8;

          if (item.type === 'obs') {
            ctx.drawImage(obsImg, item.x, item.y, obsSize, obsSize);
          } else {
            ctx.drawImage(giftImg, item.x, item.y, giftSize, giftSize);
          }

          // Collisione
          if (item.x > 60 && item.x < 60 + carWidth - 30 && carY + carHeight > item.y && carY < item.y + (item.type === 'obs' ? obsSize : giftSize)) {
            if (item.type === 'gift') {
              score++;
              playAudio('suono-regalo.mp3');
              document.getElementById('progress-bar').style.width = (score / targetScore * 100) + '%';
              items.splice(i, 1);

              if (score >= targetScore) {
                clearInterval(spawnInterval);
                vittoriaGioco();
                return;
              }
            }
          }

          if (item.x < -150) items.splice(i, 1);
        }

        requestAnimationFrame(update);
      }

      update();
    }

    function vittoriaGioco() {
      if (bgMusic) bgMusic.pause();
      playAudio('yeee.mp3');
      
      const cutContainer = document.getElementById('cutscene-container');
      const cutVignetta = document.getElementById('cutscene-vignetta');
      const cutPers = document.getElementById('cutscene-pers');
      
      cutContainer.classList.remove('hidden');
      cutVignetta.classList.add('hidden');
      cutPers.src = 'personaggio-spensierato.gif';

      setTimeout(() => {
        document.getElementById('game-screen').classList.add('hidden');
        avviaParte3();
      }, 2500);
    }

    // --- PARTE 3: REGALI ---
    function avviaParte3() {
      document.getElementById('gifts-screen').classList.remove('hidden');
      playAudio('musica-regali.mp3', true);
    }

    function apriRegalo(tipo) {
      playAudio('click.mp3');
      const dett = document.getElementById('regalo-dettaglio');
      const cont = document.getElementById('contenuto-regalo');
      dett.classList.remove('hidden');

      if (tipo === 'fiori') {
        cont.innerHTML = `<img src="bouquet.png" style="max-height: 65vh;"><h2 style="color:white; font-size: 2.2rem;">Dei fiori speciali per i tuoi 18!</h2>`;
      } else if (tipo === 'foto') {
        cont.innerHTML = `
          <h2 style="color:white; font-size: 2.5rem;">I Nostri Ricordi</h2>
          <div class="gallery-grid">
            <img src="foto1.jpg">
            <img src="foto2.jpg">
            <img src="foto3.jpg">
          </div>`;
      } else if (tipo === 'lettera') {
        cont.innerHTML = `
          <div id="let-box" onclick="apriLetteraTesto()">
            <img src="lettera-chiusa.png" style="width: 220px; cursor: pointer;">
            <p style="color:white; font-size: 1.8rem;">Clicca sulla lettera per leggerla!</p>
          </div>`;
      } else if (tipo === 'video') {
        cont.innerHTML = `<video controls src="video-auguri.mp4" style="max-width: 85vw; max-height: 65vh; border-radius: 12px; border: 4px solid #fff;"></video>`;
      } else if (tipo === 'gatto') {
        cont.innerHTML = `
          <div style="color:white;">
            <h2 style="font-size: 2.5rem;">Grazie di aver giocato!</h2>
            <p style="font-size: 1.8rem;">Realizzato da:</p>
            <h3 style="font-size: 2.2rem; color: #ff4081;">V.Sasailor</h3>
          </div>`;
      }
    }

    function apriLetteraTesto() {
      playAudio('click.mp3');
      document.getElementById('contenuto-regalo').innerHTML = `
        <div class="pergamena">
          <p>Cara Jessy,</p>
          <p>Spero ti sia piaciuto questo piccolo gioco interattivo!</p>
          <p>Grazie per essere mia amica. Non immagini quanto io sia felice quando passo il tempo in tua compagnia: so che con te posso essere me stessa.</p>
          <p>Che tutto questo rimanga nei tuoi ricordi di un meraviglioso compleanno dei 18, e che tu possa festeggiare felicemente! Non vedo l’ora di incontrarci per vederci dal vivo! Così potrò darti un abbraccio e anche i regali effettivi, ahah!</p>
          <p>Tanti cari auguri,<br>Sofia.</p>
        </div>`;
    }

    function chiudiRegalo() {
      playAudio('click.mp3');
      document.getElementById('regalo-dettaglio').classList.add('hidden');
    }
  </script>
</body>
</html>
